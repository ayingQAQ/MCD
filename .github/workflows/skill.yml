name: Validate McCosmos Skill
on:
  push:
    paths: ['skills/**', 'src/cli/**', 'src/core/**', 'src/graph/analysis.ts', 'src/data/**', 'src/mcp/**', 'scripts/*skill*', 'scripts/cosmos-cli.ts', 'tests/*skill*', 'tests/cli.test.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/skill.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test tests/cli.test.ts tests/skill-workflows.test.ts
